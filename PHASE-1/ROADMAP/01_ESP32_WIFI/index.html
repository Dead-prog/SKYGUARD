<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller console</title>
    <style>
        @media (orientation: landscape) and (max-height: 500px) {
            body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            width: 100%;
        }

        .controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
        }

        .top-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 20px;

        }

        .left-right {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .direction {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        a {
            display: inline-block;
            padding: 30px 30px;
            margin: 5px;
            border-radius: 50px;
            background-color: #1f2937;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #374151;
        }
    }

    </style>
</head>
<body>

    <header>
        <h1>SKYGUARD</h1>
    </header>


    <main>
        <div class="controller">
            <div class="top-bottom">
                <a href="/c-top" class="top">T</a>

                <a href="/c-bottom" class="bottom">B</a>
            </div>

            <div class="left-right">
                <a href="/c-left" class="left">L</a>

                <a href="/c-right" class="right">R</a>
            </div>
        </div>

        <div class="direction">
            <a href="/d-left" class="left">L</a>

            <a href="/d-right" class="right">R</a>
        </div>
    </main>
    
</body>
</html>
